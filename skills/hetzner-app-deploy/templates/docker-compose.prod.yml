services:
  postgres:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: __APP_NAME__
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: __APP_NAME__
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U __APP_NAME__ -d __APP_NAME__"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    restart: unless-stopped
    environment:
      NODE_ENV: production
      APP_ENV: production
      PORT: 3000
      DATABASE_URL: postgresql://__APP_NAME__:${POSTGRES_PASSWORD}@postgres:5432/__APP_NAME__?schema=public
      SESSION_SECRET: ${SESSION_SECRET}
    volumes:
      - uploads:/app/data/uploads
    depends_on:
      postgres:
        condition: service_healthy

  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - app

volumes:
  pgdata:
  uploads:
  caddy-data:
  caddy-config:
