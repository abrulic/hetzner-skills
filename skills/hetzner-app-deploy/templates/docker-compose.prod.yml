# Every container's log is capped here, and this is the only thing that caps it. Docker's
# `json-file` driver has no limit of its own, so a stream nobody reads grows until the disk
# does — and on a box this size the first symptom is Postgres refusing to write, which
# reads like a database fault rather than a full disk.
#
# 10 MB x 3 per service is roughly a fortnight for an app of this size and survives a
# restart loop long enough to read what caused it. If the app's privacy policy names a
# retention period for server logs, this is the thing that decides it.
x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  postgres:
    image: postgres:17
    restart: unless-stopped
    logging: *logging
    environment:
      POSTGRES_USER: __APP_NAME__
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: __APP_NAME__
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U __APP_NAME__ -d __APP_NAME__"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    restart: unless-stopped
    logging: *logging
    environment:
      NODE_ENV: production
      APP_ENV: production
      PORT: 3000
      DATABASE_URL: postgresql://__APP_NAME__:${POSTGRES_PASSWORD}@postgres:5432/__APP_NAME__?schema=public
      SESSION_SECRET: ${SESSION_SECRET}
    volumes:
      - uploads:/app/data/uploads
    depends_on:
      postgres:
        condition: service_healthy

  caddy:
    image: caddy:2
    restart: unless-stopped
    logging: *logging
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - app

volumes:
  pgdata:
  uploads:
  caddy-data:
  caddy-config:
